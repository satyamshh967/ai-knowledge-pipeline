services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: ai-knowledge-pipeline:latest

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/knowledge

    volumes:
      - ./data:/app/data

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  db:
    image: postgres:16

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: knowledge

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d knowledge"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped

volumes:
  postgres_data: